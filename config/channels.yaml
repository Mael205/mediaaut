# Definition des chaines. Une chaine = une niche + une langue + un style.
# La niche n'est PAS structurante pour le code : la changer ici suffit.

defaults:
  render:
    width: 1080
    height: 1920
    fps: 30
    # Zones tenues libres de texte, en fraction de la hauteur. L'UI de TikTok
    # et des Reels mange le bas de l'ecran ; YouTube Shorts en mange moins.
    safe_top: 0.12
    safe_bottom: 0.20
    font: Montserrat-ExtraBold
    music_gain_db: -22.0
    voice_gain_db: 0.0
  voice:
    provider: kokoro
    speed: 1.0
  subtitles:
    max_chars_per_cue: 22
    highlight: true          # karaoke mot par mot
    style: pop               # pop | clean | boxed

channels:
  - id: ai-builders-en
    name: AI Builders
    language: en
    niche: AI and developer tooling, explained for people who ship
    # Angle editorial impose au LLM : c'est ce qui distingue le contenu du
    # "mass-produced" sanctionne par la politique Inauthentic Content.
    angle: >
      Explain one mechanism that a working developer can verify for themselves:
      how a tool actually behaves, what a constraint really costs, why a common
      assumption is wrong. Stay on publicly checkable ground - documented
      behaviour, published limits, observable trade-offs.

      Never claim personal experience the script cannot support: no "I built",
      no "I tested", no invented projects or measurements. The authority comes
      from the explanation being correct, not from claiming to have run it.

      No listicles, no generic hype, no "top 10 AI tools" formats.
    voice:
      provider: kokoro
      voice_id: am_michael
      speed: 1.05
    render:
      # Rotation des templates : deux videos consecutives ne partagent jamais
      # la meme mise en page. Contre-mesure directe au filtre "template unique".
      templates: [bold_center, side_caption, split_top]
    platforms: [youtube, instagram, tiktok]
    schedule:
      shorts_per_day: 2
      times: ["09:30", "18:00"]

  - id: ai-builders-fr
    name: AI Builders FR
    language: fr
    niche: IA et outils de dev, pour ceux qui livrent vraiment
    angle: >
      Meme angle que ai-builders-en. Cette chaine est alimentee par doublage
      du contenu anglais, pas par une ecriture independante.
    voice:
      provider: kokoro
      voice_id: ff_siwis
      speed: 1.0
    render:
      templates: [bold_center, side_caption]
    platforms: [youtube]
    enabled: false            # activee en phase 7 (doublage)
    schedule:
      shorts_per_day: 1
      times: ["12:00"]
